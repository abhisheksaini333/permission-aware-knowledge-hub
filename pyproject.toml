[build-system]
requires = ["setuptools==65.6.3", "wheel==0.38.4"]
build-backend = "setuptools.build_meta"

[project]
name = "permission-aware-knowledge-hub"
version = "0.1.0"
requires-python = ">=3.10"
description = "Source-linked answers with tenant and group authorization"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
